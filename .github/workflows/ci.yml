name: SM2JS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node-version }} / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        backend: [nodejs, pure-js]

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - name: Verify native SM3 and SM4 availability
      if: matrix.backend == 'nodejs'
      run: |
        node <<'NODE'
        const assert = require('node:assert/strict')
        const crypto = require('node:crypto')
        assert.ok(crypto.getHashes().includes('sm3'), 'Native SM3 is required')
        assert.ok(crypto.getCiphers().includes('sm4-cbc'), 'Native SM4-CBC is required')
        NODE
    - name: Test Node.js backend
      if: matrix.backend == 'nodejs'
      run: npm test
    - name: Test pure JavaScript backend
      if: matrix.backend == 'pure-js'
      env:
        SM2JS_TEST_FALLBACK: '1'
      run: |
        npm exec -- standard
        node <<'NODE'
        const crypto = require('node:crypto')
        crypto.getHashes = () => []
        crypto.getCiphers = () => []
        for (const file of [
          './test/util_test',
          './test/cryptojs_sm3_test',
          './test/cryptojs_sm4_test',
          './test/jsrsasign_patch_test',
          './test/sm2_test'
        ]) {
          require(file)
        }
        NODE
